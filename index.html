
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi catálogo digital</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: auto;
      padding: 24px;
      background: #f3f6fc;
      color: #202938;
    }

    header {
      text-align: center;
      padding: 24px;
      background: white;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    h1 { color: #2457a7; }

    #catalogo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    .tarjeta {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
      overflow-wrap: anywhere;
    }

    .tarjeta a { color: #155eef; }
    #estado { text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>📚 Mi catálogo digital</h1>
    <p>Explora publicaciones y recursos digitales.</p>
  </header>

  <p id="estado">Cargando publicaciones...</p>
  <main id="catalogo"></main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxPLwAK9mwEPQXSnkxLbFJwfL32Wu4VPGRBnK0OmN0zcpq-SvdLGn9Tg7ah0tkz74LNVA/exec";

    function mostrarPublicaciones(publicaciones) {
      const catalogo = document.getElementById("catalogo");
      const estado = document.getElementById("estado");
      catalogo.replaceChildren();

      if (!Array.isArray(publicaciones)) {
        estado.textContent = "No se pudieron leer las publicaciones.";
        return;
      }

      estado.textContent = publicaciones.length
        ? "Publicaciones disponibles: " + publicaciones.length
        : "Todavía no hay publicaciones.";

      publicaciones.forEach(pub => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta";

        const titulo = document.createElement("h2");
        titulo.textContent = pub.titulo || "Sin título";
        tarjeta.appendChild(titulo);

        if (pub.categoria) {
          const categoria = document.createElement("p");
          categoria.textContent = "Categoría: " + pub.categoria;
          tarjeta.appendChild(categoria);
        }

        if (pub.autor) {
          const autor = document.createElement("p");
          autor.textContent = "Autor: " + pub.autor;
          tarjeta.appendChild(autor);
        }

        if (pub.descripcion) {
          const descripcion = document.createElement("p");
          descripcion.textContent = pub.descripcion;
          tarjeta.appendChild(descripcion);
        }

        if (pub.archivo) {
          try {
            const url = new URL(pub.archivo);
            if (url.protocol === "https:" &&
                (url.hostname === "drive.google.com" ||
                 url.hostname === "docs.google.com")) {
              const enlace = document.createElement("a");
              enlace.href = url.href;
              enlace.target = "_blank";
              enlace.rel = "noopener noreferrer";
              enlace.textContent = "📖 Abrir publicación";
              tarjeta.appendChild(enlace);
            } else {
              tarjeta.append("El enlace del archivo no es válido.");
            }
          } catch {
            tarjeta.append("El enlace del archivo no es válido.");
          }
        }

        catalogo.appendChild(tarjeta);
      });
    }

    function cargarCatalogo() {
      const estado = document.getElementById("estado");
      const script = document.createElement("script");
      const callback = "catalogoCallback";

      window[callback] = function(datos) {
        mostrarPublicaciones(datos);
        delete window[callback];
        script.remove();
      };

      script.onerror = function() {
        estado.textContent =
          "No se pudo conectar. Comprueba la URL y la implementación.";
        delete window[callback];
        script.remove();
      };

      script.src = API_URL + "?callback=" + callback;
      document.body.appendChild(script);
    }

    cargarCatalogo();
  </script>
</body>
</html>
